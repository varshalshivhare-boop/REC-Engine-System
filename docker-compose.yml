services:
  # 1. Redis - For Feature Store (Ultra low latency lookups)
  redis:
    image: redis:alpine
    container_name: rec_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 2. Qdrant - For Vector Search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rec_qdrant
    ports:
      - "6333:6333" # REST API port
      - "6334:6334" # gRPC port
    restart: unless-stopped

  # 3. Kafka (KRaft mode) - Using Official Apache Image
  kafka:
    image: apache/kafka:3.7.0
    container_name: rec_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
